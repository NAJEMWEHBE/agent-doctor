name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (no runtime deps)
        run: npm ci || npm install
      - name: Unit tests
        run: node --test
      - name: Smoke — fast tier produces valid JSON
        run: node src/cli.js --fast --json
      - name: Smoke — help + version
        run: |
          node src/cli.js --help
          node src/cli.js --version
